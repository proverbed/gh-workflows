name: Estimate Story Points (reusable)

# Reusable workflow — the canonical implementation lives HERE only. Consuming
# repos get a ~15-line caller (see README.md) that declares the real triggers
# (issues/issue_comment/workflow_dispatch) and forwards them via `uses:`.
#
# Ported from proverbed/tradekeys.co's .github/workflows/estimate-story-points.yml,
# generalized to take PROJECT_TITLE as an input instead of a hardcoded repo
# variable, since `vars` context in a reusable workflow only sees ITS OWN
# repo's variables, not the caller's — every consuming repo differs on which
# project it targets, so that value must be passed explicitly.

on:
  workflow_call:
    inputs:
      issue_number:
        description: 'Issue number to estimate (workflow_dispatch only)'
        required: false
        type: number
      project_title:
        description: >
          Name (or unique substring) of the GitHub Projects v2 board to write
          the Estimate field to. Falls back to the first project linked to
          the calling repo if omitted or not matched.
        required: false
        type: string
    secrets:
      GH_PAT:
        description: >
          PAT with repo + project scopes — the default GITHUB_TOKEN cannot
          read/write a user-level (non-org) Projects v2 board.
        required: true
      ANTHROPIC_API_KEY:
        required: true

jobs:
  estimate:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && github.event.action == 'opened') ||
      (github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'estimate') ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '/estimate'))
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Resolve issue data
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          REPO: ${{ github.repository }}
          EVENT_TITLE: ${{ github.event.issue.title }}
          EVENT_BODY: ${{ github.event.issue.body }}
          EVENT_NUMBER: ${{ github.event.issue.number }}
          EVENT_NODE_ID: ${{ github.event.issue.node_id }}
          INPUT_NUMBER: ${{ inputs.issue_number }}
        run: |
          if [ -n "$INPUT_NUMBER" ]; then
            ISSUE_JSON=$(gh api "repos/${REPO}/issues/${INPUT_NUMBER}")
            echo "title=$(echo "$ISSUE_JSON" | jq -r '.title')" >> "$GITHUB_OUTPUT"
            echo "number=${INPUT_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "node_id=$(echo "$ISSUE_JSON" | jq -r '.node_id')" >> "$GITHUB_OUTPUT"
            {
              echo "body<<BODY_EOF"
              echo "$ISSUE_JSON" | jq -r '.body // ""'
              echo "BODY_EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "title=${EVENT_TITLE}" >> "$GITHUB_OUTPUT"
            echo "number=${EVENT_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "node_id=${EVENT_NODE_ID}" >> "$GITHUB_OUTPUT"
            {
              echo "body<<BODY_EOF"
              echo "$EVENT_BODY"
              echo "BODY_EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Get issue content
        id: issue
        env:
          TITLE: ${{ steps.resolve.outputs.title }}
          BODY: ${{ steps.resolve.outputs.body }}
          NUMBER: ${{ steps.resolve.outputs.number }}
        run: |
          PROMPT=$(cat <<'PROMPT_EOF'
          You are a story points estimator. Read the GitHub issue below and assign a single story point value from the Fibonacci scale.

          | Points | Effort | Typical work |
          |--------|--------|-------------|
          | 1 | ~1 hour | Typo fix, config tweak, copy change |
          | 2 | ~2 hours | Small bug fix, single-file change with tests |
          | 3 | ~half day | Feature touching 2-3 files, moderate testing |
          | 5 | ~1 day | Multi-file feature, new component + service + tests |
          | 8 | ~1.5 days | Cross-layer feature, complex logic, significant testing |
          | 13 | ~2.5 days | Large feature spanning multiple systems, new patterns |

          Evaluate the issue across these dimensions:
          - Scope: UI only, backend only, full stack, infra, or docs
          - Complexity: How many files/systems are likely touched? New patterns or existing?
          - Ambiguity: How well-defined are the requirements?
          - Risk: Edge cases, security concerns, migration steps, cross-system dependencies?

          The response shape is enforced by the API. Keep the justification to one line.
          PROMPT_EOF
          )

          FULL_PROMPT="${PROMPT}

          ---

          ## Issue #${NUMBER}: ${TITLE}

          ${BODY}"

          ESCAPED=$(echo "$FULL_PROMPT" | jq -Rsa .)
          echo "prompt=${ESCAPED}" >> "$GITHUB_OUTPUT"

      - name: Call Anthropic Messages API
        id: llm
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PROMPT: ${{ steps.issue.outputs.prompt }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY secret is not set"
            exit 1
          fi

          REQUEST=$(jq -n --argjson prompt "$PROMPT" '{
            model: "claude-haiku-4-5",
            max_tokens: 512,
            messages: [{ role: "user", content: $prompt }],
            output_config: {
              format: {
                type: "json_schema",
                schema: {
                  type: "object",
                  properties: {
                    points: { type: "integer", enum: [1, 2, 3, 5, 8, 13] },
                    justification: { type: "string" },
                    scope: { type: "string" },
                    complexity: { type: "string", enum: ["low", "medium", "high"] },
                    ambiguity: { type: "string", enum: ["low", "medium", "high"] },
                    risk: { type: "string", enum: ["low", "medium", "high"] }
                  },
                  required: ["points", "justification", "scope", "complexity", "ambiguity", "risk"],
                  additionalProperties: false
                }
              }
            }
          }')

          RESPONSE=$(curl -s "https://api.anthropic.com/v1/messages" \
            -H "Content-Type: application/json" \
            -H "anthropic-version: 2023-06-01" \
            -H "x-api-key: ${ANTHROPIC_API_KEY}" \
            -d "$REQUEST")

          TEXT=$(echo "$RESPONSE" | jq -r '.content[0].text // empty')

          if [ -z "$TEXT" ]; then
            echo "::error::Anthropic API returned no content (stop_reason: $(echo "$RESPONSE" | jq -r '.stop_reason // "none"'))"
            echo "$RESPONSE" | jq .
            exit 1
          fi

          echo "response=${TEXT}" >> "$GITHUB_OUTPUT"

          POINTS=$(echo "$TEXT" | jq -r '.points // empty')
          if [ -z "$POINTS" ]; then
            echo "::error::Could not parse points from response: ${TEXT}"
            exit 1
          fi

          echo "points=${POINTS}" >> "$GITHUB_OUTPUT"

      - name: Update GitHub Projects v2 Estimate
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          ISSUE_NODE_ID: ${{ steps.resolve.outputs.node_id }}
          POINTS: ${{ steps.llm.outputs.points }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          PROJECT_TITLE: ${{ inputs.project_title }}
        run: |
          USER_PROJECTS=$(gh api graphql -f query='
            query($owner: String!) {
              user(login: $owner) {
                projectsV2(first: 10) {
                  nodes {
                    id
                    title
                    fields(first: 20) {
                      nodes {
                        ... on ProjectV2Field { id name dataType }
                        ... on ProjectV2SingleSelectField { id name dataType options { id name } }
                      }
                    }
                  }
                }
              }
            }' -f owner="$REPO_OWNER")

          PROJECT_ID=""
          FIELDS_JSON=""

          if [ -n "$PROJECT_TITLE" ]; then
            PROJECT_ID=$(echo "$USER_PROJECTS" | jq -r --arg t "$PROJECT_TITLE" \
              '[.data.user.projectsV2.nodes[] | select(.title | contains($t))][0].id // empty')
            FIELDS_JSON=$(echo "$USER_PROJECTS" | jq -c --arg t "$PROJECT_TITLE" \
              '[.data.user.projectsV2.nodes[] | select(.title | contains($t))][0].fields.nodes')
          fi

          if [ -z "$PROJECT_ID" ] || [ "$PROJECT_ID" = "null" ]; then
            echo "PROJECT_TITLE not set or not matched — falling back to repo-linked project"
            REPO_PROJECT=$(gh api graphql -f query='
              query($owner: String!, $repo: String!) {
                repository(owner: $owner, name: $repo) {
                  projectsV2(first: 1) {
                    nodes {
                      id
                      title
                      fields(first: 20) {
                        nodes {
                          ... on ProjectV2Field { id name dataType }
                          ... on ProjectV2SingleSelectField { id name dataType options { id name } }
                        }
                      }
                    }
                  }
                }
              }' -f owner="$REPO_OWNER" -f repo="$REPO_NAME")

            PROJECT_ID=$(echo "$REPO_PROJECT" | jq -r '.data.repository.projectsV2.nodes[0].id // empty')
            FIELDS_JSON=$(echo "$REPO_PROJECT" | jq -c '.data.repository.projectsV2.nodes[0].fields.nodes // []')
          fi

          if [ -z "$PROJECT_ID" ] || [ "$PROJECT_ID" = "null" ]; then
            echo "::warning::No project found — set project_title input or link a project to this repo"
            echo "Available projects: $(echo "$USER_PROJECTS" | jq -r '[.data.user.projectsV2.nodes[].title] | join(", ")')"
            exit 0
          fi

          echo "Available fields: $(echo "$FIELDS_JSON" | jq -r '[.[] | select(.name != null) | .name] | join(", ")')"

          FIELD_NODE=$(echo "$FIELDS_JSON" | jq -r '[.[] | select(.name == "Estimate")] | first // empty')
          FIELD_ID=$(echo "$FIELD_NODE" | jq -r '.id // empty')
          FIELD_TYPE=$(echo "$FIELD_NODE" | jq -r '.dataType // empty')

          if [ -z "$FIELD_ID" ] || [ "$FIELD_ID" = "null" ]; then
            echo "::warning::No 'Estimate' field found in project — skipping field update"
            exit 0
          fi

          echo "Found field: id=${FIELD_ID} type=${FIELD_TYPE}"

          ITEM_DATA=$(gh api graphql -f query='
            mutation($projectId: ID!, $contentId: ID!) {
              addProjectV2ItemById(input: {projectId: $projectId, contentId: $contentId}) {
                item { id }
              }
            }' -f projectId="$PROJECT_ID" -f contentId="$ISSUE_NODE_ID")

          ITEM_ID=$(echo "$ITEM_DATA" | jq -r '.data.addProjectV2ItemById.item.id // empty')

          if [ -z "$ITEM_ID" ] || [ "$ITEM_ID" = "null" ]; then
            echo "::error::Failed to add issue to project"
            echo "$ITEM_DATA" | jq .
            exit 1
          fi

          if [ "$FIELD_TYPE" = "SINGLE_SELECT" ]; then
            OPTION_ID=$(echo "$FIELD_NODE" | jq -r --arg p "$POINTS" '.options[] | select(.name == $p) | .id // empty')
            if [ -z "$OPTION_ID" ]; then
              echo "::warning::SingleSelect field has no option matching '${POINTS}' — skipping"
              exit 0
            fi
            UPDATE_DATA=$(gh api graphql -f query='
              mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                updateProjectV2ItemFieldValue(input: {
                  projectId: $projectId
                  itemId: $itemId
                  fieldId: $fieldId
                  value: { singleSelectOptionId: $optionId }
                }) {
                  projectV2Item { id }
                }
              }' -f projectId="$PROJECT_ID" -f itemId="$ITEM_ID" -f fieldId="$FIELD_ID" -f optionId="$OPTION_ID")
          else
            UPDATE_DATA=$(gh api graphql -f query='
              mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $value: Float!) {
                updateProjectV2ItemFieldValue(input: {
                  projectId: $projectId
                  itemId: $itemId
                  fieldId: $fieldId
                  value: { number: $value }
                }) {
                  projectV2Item { id }
                }
              }' -f projectId="$PROJECT_ID" -f itemId="$ITEM_ID" -f fieldId="$FIELD_ID" -F value="$POINTS")
          fi

          echo "Update response: $(echo "$UPDATE_DATA" | jq -c .)"
          UPDATE_ERRORS=$(echo "$UPDATE_DATA" | jq -r '.errors // empty')
          UPDATE_ITEM_ID=$(echo "$UPDATE_DATA" | jq -r '.data.updateProjectV2ItemFieldValue.projectV2Item.id // empty')

          if [ -n "$UPDATE_ERRORS" ] || [ -z "$UPDATE_ITEM_ID" ]; then
            echo "::error::Failed to set Estimate field"
            echo "$UPDATE_DATA" | jq .
            exit 1
          fi

          echo "Set Estimate to ${POINTS} (${FIELD_TYPE}) for issue"

      - name: Comment estimate on issue
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          RESPONSE: ${{ steps.llm.outputs.response }}
          POINTS: ${{ steps.llm.outputs.points }}
          ISSUE_NUMBER: ${{ steps.resolve.outputs.number }}
          REPO: ${{ github.repository }}
        run: |
          JUSTIFICATION=$(echo "$RESPONSE" | jq -r '.justification')
          SCOPE=$(echo "$RESPONSE" | jq -r '.scope')
          COMPLEXITY=$(echo "$RESPONSE" | jq -r '.complexity')
          AMBIGUITY=$(echo "$RESPONSE" | jq -r '.ambiguity')
          RISK=$(echo "$RESPONSE" | jq -r '.risk')

          COMMENT=$(cat <<EOF
          **${POINTS} points** — ${JUSTIFICATION}

          - **Scope**: ${SCOPE}
          - **Complexity**: ${COMPLEXITY}
          - **Ambiguity**: ${AMBIGUITY}
          - **Risk**: ${RISK}

          _Estimated by Claude Haiku 4.5 (auto)_
          EOF
          )

          gh issue comment "$ISSUE_NUMBER" \
            --repo "$REPO" \
            --body "$COMMENT"

      - name: Remove estimate label
        if: github.event_name == 'issues' && github.event.action == 'labeled'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          ISSUE_NUMBER: ${{ steps.resolve.outputs.number }}
          REPO: ${{ github.repository }}
        run: |
          gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --remove-label "estimate"
